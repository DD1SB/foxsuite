[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foxsuite"
version = "0.2.0"
description = "Offline FoxIdent infrastructure and SPORTident live compatibility gateway"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "types-pyserial", "build"]

[project.scripts]
foxsuite = "foxcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foxcore = ["py.typed"]
foxbridge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
