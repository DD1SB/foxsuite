[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foxsuite"
version = "0.3.0"
description = "Offline FoxIdent infrastructure, SPORTident gateway and local competition desk"
requires-python = ">=3.12"
dependencies = ["pyserial>=3.5,<4", "tzdata>=2024.1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "websockets>=13,<17", "jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy", "types-pyserial", "build", "httpx>=0.27,<1"]

[project.scripts]
foxsuite = "foxcore.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foxcore = ["py.typed"]
foxbridge = ["py.typed"]
foxlive = ["py.typed", "templates/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
