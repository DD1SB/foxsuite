<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxSuite Control Center</title><link rel="stylesheet" href="/ops/static/settings.css"><script src="/static/presentation.js" defer></script><script src="/ops/static/control.js" defer></script></head>
<body><header><h1>FoxSuite</h1><label><span data-t="language">Language</span> <select id="language"><option value="en">English</option><option value="de">Deutsch</option></select></label></header>
<main><h2 id="control-title" data-t="control">Control Center</h2><p data-t="control_help"></p><p id="message" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
<section><h2>FoxIdentServer</h2><p id="source-state" role="status"></p><dl><dt data-t="port">Serial port</dt><dd id="source-port"></dd><dt data-t="sync">TimeSync</dt><dd id="source-sync"></dd><dt data-t="last_message">Last message</dt><dd id="source-message"></dd><dt data-t="last_error">Last error</dt><dd id="source-error"></dd></dl><p id="identity" data-t="identity_missing" hidden></p><button id="reconnect" data-t="reconnect" disabled>Reconnect</button><a href="/settings" data-t="settings">Settings</a></section>
<section><h2>FoxCore</h2><p id="core-state" role="status"></p><p id="core-counts"></p></section>
<section><h2>FoxLive</h2><p id="live-state" role="status"></p><p id="live-event"></p><p id="live-error"></p><a id="open-live" href="/live" data-t="desk">Open FoxLive</a></section>
<section><h2>FoxBridge</h2><p id="bridge-state" role="status"></p><dl><dt data-t="bridge_output">Output</dt><dd id="bridge-output"></dd><dt data-t="bridge_delivery">Delivery status</dt><dd id="bridge-delivery"></dd><dt data-t="last_error">Last error</dt><dd id="bridge-error"></dd></dl><p data-t="bridge_ack"></p><button id="bridge-toggle" disabled>Start</button><a href="/settings#bridge" data-t="settings">Settings</a></section>
<section><h2 data-t="system">System</h2><dl><dt data-t="data_location">Data location</dt><dd id="system-data"></dd><dt data-t="version">Version</dt><dd id="system-version"></dd></dl><p data-t="background_help"></p><a href="/settings" data-t="settings">Settings</a><a href="/settings#normal" data-t="backup">Backup and restore</a><button id="diagnostics" data-t="diagnostics" disabled>Diagnostics</button><button id="restart" data-t="restart_suite" disabled>Restart FoxSuite</button><button id="exit" data-t="exit_suite" disabled>Exit FoxSuite</button><p data-t="shutdown_help"></p>
<details id="diagnostic-panel"><summary data-t="diagnostics">Diagnostics</summary><dl><dt data-t="logs">Logs</dt><dd id="system-logs"></dd><dt data-t="settings">Settings</dt><dd id="system-settings"></dd><dt data-t="process">Process</dt><dd id="system-process"></dd></dl><pre id="diagnostic-entries"></pre></details></section>
</main></body></html>
