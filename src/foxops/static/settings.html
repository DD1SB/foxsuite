<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoxSuite</title><link rel="stylesheet" href="/ops/static/settings.css"><script src="/static/presentation.js" defer></script><script src="/ops/static/settings.js" defer></script></head>
<body><header><h1>FoxSuite</h1><label><span data-t="language">Language</span> <select id="language"><option value="en">English</option><option value="de">Deutsch</option></select></label></header>
<main><h2 id="title" data-t="setup">First-run setup</h2><p id="override" data-t="override" hidden></p><p id="message" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p>
<nav id="steps" aria-label="Setup"></nav>
<form id="settings-form">
<fieldset data-step="0"><legend data-t="language">Language</legend><p data-t="language_help"></p></fieldset>
<fieldset data-step="1"><legend data-t="source">FoxIdentServer</legend><p data-t="source_help"></p><label><span data-t="port">Serial port</span><select id="port"></select></label><button id="refresh" type="button" data-t="refresh">Refresh ports</button><p id="suggestion" hidden></p><button id="use-suggestion" type="button" data-t="use_port" hidden>Use this port</button><details><summary data-t="advanced">Advanced</summary><label><span data-t="manual_port">Other serial port</span><input id="manual-port" maxlength="300"></label><label><span data-t="baud">Baud rate</span><input id="baud" type="number" min="1" max="4000000" value="115200" required></label></details></fieldset>
<fieldset data-step="2"><legend data-t="test">Test connection</legend><p data-t="test_help"></p><button id="test" type="button" data-t="test">Test connection</button><p id="test-result" role="status"></p><label><input id="time-sync" type="checkbox" checked><span data-t="sync">Automatic time synchronization</span></label><details><summary data-t="advanced">Advanced</summary><label><span data-t="sync_interval">Time refresh interval (seconds)</span><input id="sync-interval" type="number" min="0.1" max="86400" step="0.1" value="60" required></label><label><span data-t="reconnect_interval">Reconnect interval (seconds)</span><input id="reconnect-interval" type="number" min="0.1" max="3600" step="0.1" value="2" required></label></details></fieldset>
<fieldset data-step="3"><legend data-t="data">Competition data</legend><label><span data-t="data_location">Current data folder</span><input id="data-location" readonly></label><p data-t="data_help"></p><details><summary data-t="change_data">Change data location</summary><label><span data-t="new_folder">New data folder</span><input id="new-folder" maxlength="1000"></label><button id="browse-folder" type="button" data-t="browse">Choose folder</button><label><span data-t="data_action">What should happen to the data?</span><select id="data-mode"><option value="copy" data-t="copy">Copy current data</option><option value="move" data-t="move">Move current data</option><option value="existing" data-t="existing">Use existing database at destination</option></select></label><p data-t="move_help"></p><button id="change-data" type="button" data-t="apply_data">Apply data change and restart</button></details></fieldset>
<fieldset data-step="4"><legend>FoxLive</legend><p data-t="live_help"></p><details><summary data-t="advanced">Advanced</summary><label><span data-t="http_port">Browser port</span><input id="http-port" type="number" min="1024" max="65535" required value="8765"></label><label><span data-t="logging">Log detail</span><select id="logging-level"><option value="INFO" data-t="log_info">Normal</option><option value="DEBUG" data-t="log_debug">Detailed diagnostics</option><option value="WARNING" data-t="log_warning">Warnings and errors</option><option value="ERROR" data-t="log_error">Errors only</option><option value="CRITICAL" data-t="log_critical">Critical errors only</option></select></label></details></fieldset>
<div id="wizard-buttons"><button id="previous" type="button" data-t="previous">Back</button><button id="next" type="button" data-t="next">Next</button><button id="finish" data-t="finish">Finish setup</button></div>
</form>
<section id="normal" hidden><a href="/" data-t="desk">Open FoxLive</a><h2 data-t="backup">Backup and restore</h2><p data-t="backup_help"></p><button id="backup" data-t="make_backup">Create backup</button><label><span data-t="import_backup">Import a FoxSuite backup</span><input id="import-file" type="file" accept=".foxbackup"></label><button id="import-backup" data-t="import_backup">Import a FoxSuite backup</button><label><span data-t="backups">Available backups</span><select id="backups"></select></label><a id="download" data-t="download">Download selected backup</a><button id="restore" data-t="restore">Restore selected backup</button><p data-t="restore_help"></p>
<details><summary data-t="locations">Technical locations</summary><dl id="locations"></dl></details><h2 data-t="shutdown">Shut down FoxSuite</h2><p data-t="shutdown_help"></p><button id="shutdown" data-t="shutdown">Shut down FoxSuite</button></section>
</main></body></html>
