[env:esp32-s3-wroom-1u-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Native USB-Einstellungen
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
; 16MB Partitionslayout aktivieren (z.B. große App mit viel SPIFFS)
board_build.partitions = default_16MB.csv


; Spezifischer Speichertyp für 16MB Flash (QIO) und 8MB PSRAM (OPI)
board_build.arduino.memory_type = qio_opi

; Build Flags für PSRAM und Native USB CDC
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -Wdouble-promotion

; Port-Einstellungen für den seriellen Monitor
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1

; LORA Bibliothek
lib_deps =
    jgromes/RadioLib @ ^7.7.1

build_src_filter = 
    +<*>
    -<samples/>